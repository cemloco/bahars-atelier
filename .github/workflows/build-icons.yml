name: Build Bahar's Atelier app icons
on:
  push:
    branches: [main]
    paths:
      - 'ba-icon-128.png'
      - '.github/workflows/build-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Render iPhone and PWA icons
        run: |
          python - <<'PY'
          from PIL import Image
          src=Image.open('ba-icon-128.png').convert('RGB')
          for name, size in [('apple-touch-icon.png',180),('icon-192.png',192),('icon-512.png',512)]:
              src.resize((size,size),Image.Resampling.LANCZOS).save(name,'PNG',optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          if ! git diff --staged --quiet; then
            git commit -m "Generate iPhone and PWA icons from BA monogram"
            git push
          fi
